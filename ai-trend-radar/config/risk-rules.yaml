risk_levels:
  LOW:
    description: "발행 검토 가능. 그래도 출처와 사용 권리를 확인한다."
    examples:
      - "공식 발표"
      - "공식 문서"
      - "오픈소스 릴리즈"
      - "제품 업데이트"
      - "논문"
      - "일반적 활용 팁"
      - "도구 소개"

  MEDIUM:
    description: "해석과 사실을 분리하고, 검증 부족 지점을 명시한다."
    examples:
      - "커뮤니티 반응"
      - "유튜브 데모"
      - "아직 검증되지 않은 신기술"
      - "수익화 가능성 해석"
      - "개인 경험담"
      - "특정 회사/서비스에 대한 해석"

  HIGH:
    description: "기본적으로 HOLD 처리한다."
    examples:
      - "정치"
      - "투자"
      - "코인"
      - "특정 종목 추천"
      - "리딩방"
      - "수익 보장"
      - "특정 인물 발언"
      - "특정 기업 저격"
      - "실존 인물 가짜 이미지"
      - "출처 없는 숫자"
      - "의료/법률/금융 조언"
      - "공포 조장"
      - "혐오/비하"
      - "허위정보 가능성이 높은 주장"

default_actions:
  LOW: "candidate_review"
  MEDIUM: "candidate_review_with_caution"
  HIGH: "HOLD"

hard_hold_triggers:
  - "risk_level = HIGH"
  - "source_confidence < 6"
  - "사실 확인이 부족함"
  - "저작권 위험이 큼"
  - "제목은 자극적이지만 내용이 빈약함"
  - "출처가 불명확함"
  - "수익 보장이나 확정 수익 표현이 있음"
  - "실존 인물 가짜 발언이나 가짜 이미지가 있음"
